<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<title>DOOHPLAY Player</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta http-equiv="Cache-Control" content="no-store">

<link rel="preconnect" href="http://localhost:3000">

<style>

html,body{
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
  width:100%;
  height:100%;
}

#player{
  width:100vw;
  height:100vh;
}

video,img{
  width:100vw;
  height:100vh;
  object-fit:cover;
}

*{
  user-select:none;
}

</style>

</head>

<body>

<div id="player"></div>

<noscript>
DOOHPLAY player requires JavaScript
</noscript>

<script>

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("/player/sw.js")
    .then(()=>console.log("service worker registered"))
    .catch(err=>console.log("service worker error",err))

}

</script>

<script src="/player/player.js"></script>

</body>
</html>
