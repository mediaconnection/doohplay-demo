# v8
name: Build Fire Stick APK

on:
  push:
    paths:
      - 'firestick-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.6 and generate wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --project-dir firestick-app
          chmod +x firestick-app/gradlew

      - name: Build Release APK
        working-directory: firestick-app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doohplay-firestick-v1.0
          path: firestick-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
